name: Blue Production Pipeline

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: tokyo-analyst-480722-h5
  GAR_LOCATION: europe-west2
  REPOSITORY: week3-images
  IMAGE: blue
  GKE_CLUSTER: week2-gke
  GKE_LOCATION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Build Blue image
        run: |
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest .

      - name: Push Blue image
        run: |
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --region $GKE_LOCATION \
            --project $PROJECT_ID

      - name: Deploy Blue
        run: |
          kubectl apply -f deployment-blue.yaml
          kubectl rollout restart deployment blue-deployment
          kubectl apply -f service-bluegreen.yaml
